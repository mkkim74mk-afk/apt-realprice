<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아파트 실거래 카드</title>
<style>
  :root{
    --paper:#ece6d8; --paper2:#e1dac8; --ink:#1b2620; --inksoft:#5c665e;
    --line:#d6cfbc; --card:#fbfaf4; --sale:#0e6a4b; --salesoft:#e4efe8;
    --jeonse:#b25e29; --jeonsesoft:#f3e7da; --gold:#a4824a;
    --arch:#5a4a8a; --archsoft:#eeeaf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink); -webkit-text-size-adjust:100%;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background-image:radial-gradient(circle at 15% 0%,rgba(255,255,255,.5),transparent 45%),
      radial-gradient(circle at 100% 100%,rgba(164,130,74,.10),transparent 40%);
    min-height:100vh;
  }
  .wrap{max-width:540px;margin:0 auto;padding:0 14px 44px}
  .eyebrow{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:700;padding-top:26px}
  h1{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .sub{margin:8px 0 0;font-size:13.5px;color:var(--inksoft);line-height:1.5}
  .meta{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
  .meta .chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:12px;color:var(--inksoft)}
  .meta .chip b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .meta .dark{background:var(--ink);color:#f4efe2;border:none}
  .meta .dark span{display:block;font-size:10.5px;opacity:.7;letter-spacing:.08em}
  .meta .dark b{color:#fff;font-size:15px}

  /* ── 아카이브 섹션 ── */
  .arch-bar{display:flex;align-items:center;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
  .arch-bar .arch-label{font-size:12px;font-weight:700;color:var(--arch);letter-spacing:.05em}
  .arch-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .arch-chip{padding:5px 12px;border-radius:20px;border:1.5px solid var(--arch);background:var(--archsoft);
    color:var(--arch);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s}
  .arch-chip:hover,.arch-chip.active{background:var(--arch);color:#fff}
  .arch-chip.live{border-color:var(--gold);background:var(--card);color:var(--gold)}
  .arch-chip.live.active{background:var(--gold);color:#fff}
  .arch-badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:6px;
    background:var(--arch);color:#fff;margin-left:3px;vertical-align:middle}
  .arch-badge.live{background:var(--gold)}

  .search{position:relative;margin:12px 0}
  .search input{width:100%;padding:11px 38px 11px 16px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);font:inherit;font-size:15px;color:var(--ink);outline:none}
  .search .clr{position:absolute;right:8px;top:7px;border:none;background:var(--paper2);border-radius:8px;
    width:28px;height:28px;cursor:pointer;font-size:15px;color:var(--inksoft)}
  .banner{display:flex;gap:8px;align-items:center;background:var(--jeonsesoft);color:var(--jeonse);
    border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
  .navtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .navtop .now{flex:1;min-width:0;text-align:center}
  .navtop .now .nm{display:block;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navtop .now .ct{display:block;font-size:11px;color:var(--inksoft);margin-top:1px;font-variant-numeric:tabular-nums}
  .navtop button{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .navtop button:disabled{opacity:.3;cursor:default}
  .scroller{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px;
    scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;
    box-shadow:0 12px 30px -18px rgba(27,38,32,.4);animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .chead{display:flex;gap:12px;align-items:flex-start}
  .badge{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#f4efe2;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .cname{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .cinfo{font-size:12px;color:var(--inksoft);margin-top:3px;line-height:1.45}
  .stats{display:flex;gap:8px;margin-top:14px}
  .stat{flex:1;border-radius:12px;padding:8px 10px}
  .stat .l{font-size:10.5px;color:var(--inksoft)}
  .stat .v{font-size:15px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}

  /* ── 탭 ── */
  .tabs{display:flex;gap:6px;margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabBtn{flex:1;padding:8px 4px 10px;border:none;background:none;font:inherit;font-size:13.5px;
    font-weight:700;color:var(--inksoft);cursor:pointer;border-bottom:2px solid transparent;
    margin-bottom:-1px;transition:color .15s,border-color .15s}
  .tabBtn.active{color:var(--ink);border-bottom-color:var(--ink)}
  .tabBtn.sale-btn.active{color:var(--sale);border-bottom-color:var(--sale)}
  .tabBtn.jeonse-btn.active{color:var(--jeonse);border-bottom-color:var(--jeonse)}
  .tabPane{display:none;margin-top:12px}
  .tabPane.show{display:block}

  /* ── 테이블 행 ── */
  .rowh,.row{display:grid;gap:4px;align-items:center}
  .rowh{font-size:10.5px;color:var(--inksoft);padding:0 2px 5px}
  .row{padding:7px 2px;border-top:1px solid var(--line);font-size:13px}
  .row .dt{color:var(--inksoft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .ad{color:var(--inksoft);font-size:11.5px;text-align:center;font-variant-numeric:tabular-nums}
  .row .ar b{font-weight:600;font-variant-numeric:tabular-nums}
  .row .ar .py{font-size:11px;margin-left:5px;font-weight:600}
  .row .fl{text-align:center;color:var(--inksoft);font-variant-numeric:tabular-nums}
  .row .amt{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .row .rw{text-align:right}
  .rnbadge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap;display:inline-block}
  .rnbadge.new{background:#e8f4ec;color:#0e6a4b}
  .rnbadge.renew{background:#fce9d8;color:#b25e29}
  .empty{font-size:12.5px;color:var(--inksoft);padding:8px 2px}
  .note{margin:14px 0 0;font-size:10.5px;color:var(--inksoft);line-height:1.45}
  .hint{text-align:center;margin-top:10px;font-size:11.5px;color:var(--inksoft)}
  .load{text-align:center;padding:60px 0;color:var(--inksoft)}

  /* ── 아카이브 뷰 헤더 ── */
  .arch-header{background:var(--archsoft);border:1.5px solid var(--arch);border-radius:14px;
    padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .arch-header .ah-icon{font-size:18px}
  .arch-header .ah-text{font-size:13px;font-weight:700;color:var(--arch)}
  .arch-header .ah-sub{font-size:11px;color:var(--inksoft);margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">◈ 강남·송파·강동·서초</div>
  <h1>아파트 실거래 카드</h1>
  <p class="sub">매매·전세 · 전용면적 기준 추정 평형 · 월 2회 자동 갱신</p>

  <div class="meta" id="meta"></div>

  <!-- 아카이브 선택 바 -->
  <div class="arch-bar">
    <span class="arch-label">📁 월별 보기</span>
    <div class="arch-chips" id="archChips"></div>
  </div>

  <div class="search">
    <input id="q" placeholder="아파트 검색 (예: 래미안, 헬리오, 압구정)" oninput="onSearch()">
    <button class="clr" id="clr" style="display:none" onclick="clearQ()">×</button>
  </div>

  <div id="app"><div class="load">불러오는 중…</div></div>
</div>

<script>
const EOK = 10000;
let LIVE = null;      // 현재 data.json
let CURRENT = null;   // 현재 표시 중인 데이터 (live or archive)
let view = [], idx = 0;
let activeTab = {};

// ── 아카이브 목록 (fetch.py가 저장하는 경로 패턴에 맞게 스캔)
// GitHub Pages는 디렉터리 목록을 제공하지 않으므로
// 현재 날짜 기준 최근 24개월을 순서대로 시도해서 존재하는 것만 표시
const ARCH_MONTHS = (()=>{
  const list = [];
  const now = new Date();
  for(let i=1; i<=24; i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    list.push(`${y}-${m}`);
  }
  return list;
})();

function won(m){
  if(!m) return '-';
  const eok=Math.floor(m/EOK), rest=m%EOK;
  if(eok>0) return rest>0 ? eok+'억 '+rest.toLocaleString() : eok+'억';
  return m.toLocaleString()+'만';
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function sortRows(rows){
  return rows.slice().sort((a,b)=>{
    if(a.pyeong!==b.pyeong) return a.pyeong-b.pyeong;
    const da=a.ym+a.day, db=b.ym+b.day;
    return da<db?-1:da>db?1:0;
  });
}
function hasAptDong(rows){ return rows.some(r=>r.apt_dong&&r.apt_dong.length>0); }

function rowsHtml(rows, kind, color){
  if(!rows.length) return '<div class="empty">해당 기간 거래 없음</div>';
  const sorted=sortRows(rows);
  const showDong=hasAptDong(sorted);
  let cols;
  if(kind==='jeonse'){
    cols=showDong?'52px 28px 1fr 34px 44px 1fr':'52px 1fr 34px 44px 1fr';
  } else {
    cols=showDong?'52px 28px 1fr 34px 1fr':'52px 1fr 34px 1fr';
  }
  const gs=`grid-template-columns:${cols}`;
  const amtLabel=kind==='sale'?'거래금액':'보증금';

  let head=`<div class="rowh" style="${gs}">`;
  head+='<span>계약일</span>';
  if(showDong) head+='<span style="text-align:center">동</span>';
  head+='<span>전용/평형</span>';
  head+='<span style="text-align:center">층</span>';
  if(kind==='jeonse') head+='<span style="text-align:right">구분</span>';
  head+=`<span style="text-align:right">${amtLabel}</span></div>`;

  const body=sorted.map(r=>{
    const dateStr=r.ym.slice(4,6)+'/'+r.day;
    const areaStr=`<b>${r.area}㎡</b><span class="py" style="color:${color}">약 ${r.pyeong}평</span>`;
    let html=`<div class="row" style="${gs}">`;
    html+=`<span class="dt">${dateStr}</span>`;
    if(showDong) html+=`<span class="ad">${esc(r.apt_dong||'')}</span>`;
    html+=`<span class="ar">${areaStr}</span>`;
    html+=`<span class="fl">${r.floor||'-'}</span>`;
    if(kind==='jeonse'){
      const isRenew=(r.renew==='갱신');
      html+=`<span class="rw"><span class="rnbadge ${isRenew?'renew':'new'}">${isRenew?'갱신':'신규'}</span></span>`;
    }
    html+=`<span class="amt" style="color:${color}">${won(r.amount)}</span></div>`;
    return html;
  }).join('');
  return head+body;
}

function infoLine(c){
  const parts=[c.loc||''];
  if(c.built) parts.push(c.built+'년 준공');
  if(c.units) parts.push(c.units.toLocaleString()+'세대');
  return parts.filter(Boolean).join(' · ');
}

function cardHtml(c, eff){
  const cid=c.id||c.name;
  const tab=activeTab[cid]||'sale';
  const top=c.sale.reduce((m,r)=>Math.max(m,r.amount),0);
  const saleHtml  =rowsHtml(c.sale,  'sale',  'var(--sale)');
  const jeonseHtml=rowsHtml(c.jeonse,'jeonse','var(--jeonse)');
  return '<div class="slide"><div class="card">'
    +'<div class="chead"><div class="badge">🏢</div><div style="min-width:0;flex:1">'
      +'<h2 class="cname">'+esc(c.name)+'</h2>'
      +'<div class="cinfo">'+esc(infoLine(c))+'</div></div></div>'
    +'<div class="stats">'
      +'<div class="stat" style="background:var(--salesoft)"><div class="l">매매</div><div class="v" style="color:var(--sale)">'+c.sale.length+'건</div></div>'
      +'<div class="stat" style="background:var(--jeonsesoft)"><div class="l">전세</div><div class="v" style="color:var(--jeonse)">'+c.jeonse.length+'건</div></div>'
      +'<div class="stat" style="background:var(--paper);flex:1.4"><div class="l">최고 매매가</div><div class="v">'+(top?won(top):'-')+'</div></div>'
    +'</div>'
    +'<div class="tabs">'
      +'<button class="tabBtn sale-btn'+(tab==='sale'?' active':'')+'" onclick="switchTab(\''+cid+'\',\'sale\',this)">매매 '+c.sale.length+'건</button>'
      +'<button class="tabBtn jeonse-btn'+(tab==='jeonse'?' active':'')+'" onclick="switchTab(\''+cid+'\',\'jeonse\',this)">전세 '+c.jeonse.length+'건</button>'
    +'</div>'
    +'<div id="pane-sale-'+cid+'" class="tabPane'+(tab==='sale'?' show':'')+'">'+ saleHtml+'</div>'
    +'<div id="pane-jeonse-'+cid+'" class="tabPane'+(tab==='jeonse'?' show':'')+'">'+ jeonseHtml+'</div>'
    +'<p class="note">※ 평형은 전용면적 ÷ '+eff+'(전용률 가정) ÷ 3.3058 로 산출한 추정치입니다.</p>'
    +'</div></div>';
}

function switchTab(cid, kind, btn){
  activeTab[cid]=kind;
  const card=btn.closest('.card');
  card.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['sale','jeonse'].forEach(k=>{
    const p=document.getElementById('pane-'+k+'-'+cid);
    if(p) p.classList.toggle('show',k===kind);
  });
}

function render(data, isArchive){
  const app=document.getElementById('app');
  const q=document.getElementById('q').value.replace(/\s/g,'').toLowerCase();
  view=!q ? data.targets.slice()
          : data.targets.filter(t=>
              t.name.replace(/\s/g,'').toLowerCase().includes(q)||
              (t.loc||'').replace(/\s/g,'').toLowerCase().includes(q));
  if(!view.length){ app.innerHTML='<div class="load">검색 결과가 없습니다.</div>'; return; }
  if(idx>=view.length) idx=0;

  // 아카이브 헤더
  let archHeader='';
  if(isArchive){
    const m=data.month||'';
    archHeader=`<div class="arch-header"><span class="ah-icon">📁</span>`
      +`<div><div class="ah-text">${m} 완성본</div>`
      +`<div class="ah-sub">매달 28일 저장 · 해당 월 전체 신고 포함</div></div></div>`;
  }

  app.innerHTML=
    '<div class="navtop">'
    +'<button id="prev" onclick="go(-1)">‹</button>'
    +'<div class="now"><span class="nm" id="nm"></span><span class="ct" id="ct"></span></div>'
    +'<button id="next" onclick="go(1)">›</button>'
    +'</div>'
    + archHeader
    +'<div class="scroller" id="sc" onscroll="onScroll()">'
    +view.map(c=>cardHtml(c, data.efficiency)).join('')
    +'</div>'
    +'<p class="hint">옆으로 넘기거나 검색해보세요</p>';
  updateNav();
  const sc=document.getElementById('sc');
  if(sc&&idx>0) sc.scrollLeft=idx*sc.clientWidth;
}

function onScroll(){
  const sc=document.getElementById('sc');
  idx=Math.round(sc.scrollLeft/sc.clientWidth);
  updateNav();
}
function go(d){
  const sc=document.getElementById('sc');
  sc.scrollBy({left:d*sc.clientWidth,behavior:'smooth'});
}
function updateNav(){
  const nm=document.getElementById('nm');
  const ct=document.getElementById('ct');
  if(!nm||!ct) return;
  nm.textContent=view[idx]?.name||'';
  ct.textContent=(idx+1)+' / '+view.length;
  document.getElementById('prev').disabled=idx<=0;
  document.getElementById('next').disabled=idx>=view.length-1;
}
function onSearch(){
  const q=document.getElementById('q').value;
  document.getElementById('clr').style.display=q?'block':'none';
  idx=0;
  render(CURRENT, CURRENT!==LIVE);
}
function clearQ(){ document.getElementById('q').value=''; onSearch(); }

// ── 아카이브 칩 선택
let currentArchMonth=null;

function selectLive(){
  currentArchMonth=null;
  CURRENT=LIVE;
  idx=0;
  document.querySelectorAll('.arch-chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('.arch-chip.live')?.classList.add('active');
  render(LIVE, false);
}

function selectArchive(ym, el){
  document.querySelectorAll('.arch-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  currentArchMonth=ym;
  el.textContent='불러오는 중…';
  fetch(`./archive/${ym}.json?v=`+Date.now())
    .then(r=>{ if(!r.ok) throw new Error('없음'); return r.json(); })
    .then(d=>{
      el.textContent=ym;
      CURRENT=d; idx=0;
      render(d, true);
    })
    .catch(()=>{
      el.textContent=ym+' (없음)';
      el.classList.remove('active');
      currentArchMonth=null;
    });
}

// ── 아카이브 목록 탐색 (존재하는 파일만 칩으로 표시)
async function probeArchives(){
  const chips=document.getElementById('archChips');
  // 라이브 칩 (항상 첫번째)
  const liveEl=document.createElement('button');
  liveEl.className='arch-chip live active';
  liveEl.textContent='최신';
  liveEl.onclick=()=>selectLive();
  chips.appendChild(liveEl);

  // 과거 아카이브 존재 여부 병렬 확인 (HEAD 요청)
  const results = await Promise.all(
    ARCH_MONTHS.map(ym =>
      fetch(`./archive/${ym}.json`,{method:'HEAD'})
        .then(r=>r.ok?ym:null).catch(()=>null)
    )
  );
  results.filter(Boolean).forEach(ym=>{
    const el=document.createElement('button');
    el.className='arch-chip';
    el.textContent=ym;
    el.onclick=()=>selectArchive(ym,el);
    chips.appendChild(el);
  });
}

// ── 초기 로드
fetch('./data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  LIVE=d; CURRENT=d;
  // 상단 메타 칩
  let html='<div class="chip dark"><span>조회 대상 (계약월)</span><b>'+d.window+'</b></div>'
    +'<div class="chip">총 <b>'+d.targets.length+'</b> 단지 · 갱신 <b>'+d.generated+'</b></div>';
  document.getElementById('meta').innerHTML=html;
  if(d.demo){
    const b=document.createElement('div'); b.className='banner';
    b.textContent='ⓘ 샘플(예시) 데이터입니다. 워크플로를 실제 키로 한 번 더 실행하세요.';
    document.getElementById('app').before(b);
  }
  render(d, false);
  probeArchives();
}).catch(()=>{
  document.getElementById('app').innerHTML=
    '<div class="load">data.json 을 불러오지 못했습니다.<br>워크플로를 한 번 실행해 생성하세요.</div>';
});
</script>
</body>
</html>
