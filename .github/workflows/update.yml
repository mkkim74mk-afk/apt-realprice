name: 실거래 자동 갱신

on:
  schedule:
    - cron: '0 0 12 * *'
    - cron: '0 0 28 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 실거래 수집 → data.json (+ 28일엔 archive/)
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: python fetch.py

      - name: 변경분 커밋
        run: |
          git config user.name  "molit-bot"
          git config user.email "molit-bot@users.noreply.github.com"
          git add data.json
          git add archive/ 2>/dev/null || true
          git commit -m "auto update $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git push
