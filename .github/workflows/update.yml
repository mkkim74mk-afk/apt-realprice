name: 실거래 자동 갱신

on:
  schedule:
    - cron: '0 0 30 * *'    # 매월 30일 00:00 UTC(=한국 09:00). 30일이 있는 모든 달
    - cron: '0 0 28 2 *'    # 2월은 30일이 없으므로 28일에 실행
  workflow_dispatch: {}      # '수동 실행' 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 실거래 수집 → data.json
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: python fetch.py

      - name: 변경분 커밋
        run: |
          git config user.name  "molit-bot"
          git config user.email "molit-bot@users.noreply.github.com"
          git add data.json
          git commit -m "auto update $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git push
